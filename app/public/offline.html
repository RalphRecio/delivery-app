<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pasuyo Parang · Offline</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: -apple-system, system-ui, sans-serif;
                background: #f2f8f4;
                color: #14341f;
                text-align: center;
                padding: 24px;
            }
            .mark {
                width: 72px;
                height: 72px;
                border-radius: 20px;
                background: #2e9b4f;
                color: #fff;
                display: grid;
                place-items: center;
                font-size: 36px;
                font-weight: 800;
                margin: 0 auto 16px;
            }
            h1 {
                font-size: 22px;
                margin: 0 0 8px;
            }
            p {
                color: #5a6f60;
                margin: 0 0 20px;
            }
            button {
                font: inherit;
                font-weight: 700;
                color: #fff;
                background: #2e9b4f;
                border: 0;
                border-radius: 12px;
                padding: 14px 24px;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="mark">P</div>
            <h1>You're offline</h1>
            <p>
                Pasuyo Parang needs a connection to load your bookings. Check your signal and try
                again.
            </p>
            <button onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
